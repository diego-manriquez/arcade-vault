  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #faf9f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }
  </style>
  <noscript>
    <style>#__bundler_loading { display: none; }</style>
    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">

<body>
  <div id="__bundler_placeholder">Loading Arcade Vault...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

city:1}20%,24%,55%{opacity:.35}}\n.blink{animation:blink 1.1s steps(1) infinite}\n@keyframes blink{50%{opacity:0}}\n\n/* navbar */\n.nav{position:sticky;top:0;z-index:50;background:rgba(10,10,15,.86);backdrop-filter:blur(8px);border-bottom:1px solid rgba(0,245,255,.25);box-shadow:0 0 24px rgba(0,245,255,.08)}\n.logo-btn{background:none;border:0;padding:6px 0;min-height:44px}\n.nav-link{background:none;border:0;padding:12px 2px;min-height:44px;font-family:'Press Start 2P',monospace;font-size:11px;color:#b9b9d2;position:relative}\n.nav-link:hover{color:#fff}\n.nav-link.on{color:#00f5ff}\n.nav-link.on::after{content:\"\";position:absolute;left:0;right:0;bottom:4px;height:3px;background:#00f5ff;box-shadow:0 0 8px #00f5ff,0 0 18px rgba(0,245,255,.6)}\n.burger{display:none;width:44px;height:44px;background:none;border:2px solid #00f5ff;align-items:center;justify-content:center}\n@media (max-width:760px){.nav-links{display:none !important}.burger{display:flex}.hide-sm{display:none !important}}\n.panel{position:fixed;top:0;right:0;bottom:0;width:min(82vw,320px);z-index:80;background:#0d0d16;border-left:2px solid #ff006e;box-shadow:-10px 0 40px rgba(255,0,110,.25);transform:translateX(105%);transition:transform .25s ease;padding:20px;display:flex;flex-direction:column;gap:12px}\n.panel.open{transform:translateX(0)}\n.scrim{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.6)}\n.panel-link{background:none;border:2px solid #2a2a3d;text-align:left;padding:16px;min-height:52px;font-family:'Press Start 2P',monospace;font-size:11px}\n.panel-link.on{border-color:#00f5ff;color:#00f5ff;box-shadow:0 0 12px rgba(0,245,255,.3)}\n\n/* botones */\n.btn{font-family:'Press Start 2P',monospace;font-size:11px;padding:14px 18px;min-height:44px;background:transparent;border:2px solid #00f5ff;color:#00f5ff;box-shadow:0 0 0 rgba(0,245,255,0),inset 0 0 0 rgba(0,245,255,0);transition:box-shadow .15s,background .15s,color .15s,transform .06s;text-transform:uppercase}\n.btn:hover{background:rgba(0,245,255,.1);box-shadow:0 0 14px rgba(0,245,255,.65),inset 0 0 10px rgba(0,245,255,.25);color:#fff}\n.btn:active{transform:scale(.95) translateY(2px)}\n.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}\n.btn-m{border-color:#ff006e;color:#ff006e}.btn-m:hover{background:rgba(255,0,110,.12);box-shadow:0 0 14px rgba(255,0,110,.7),inset 0 0 10px rgba(255,0,110,.25)}\n.btn-y{border-color:#f5ff00;color:#f5ff00}.btn-y:hover{background:rgba(245,255,0,.1);box-shadow:0 0 14px rgba(245,255,0,.6)}\n.btn-ghost{border-color:#3a3a52;color:#c9c9de}.btn-ghost:hover{border-color:#c9c9de;box-shadow:0 0 10px rgba(255,255,255,.2)}\n.btn-solid{background:#f5ff00;color:#0a0a0f;border-color:#f5ff00}.btn-solid:hover{background:#fbff6a;color:#0a0a0f}\n.pulse{animation:pulse 1.4s ease-in-out infinite}\n@keyframes pulse{0%,100%{box-shadow:0 0 10px rgba(245,255,0,.5),0 0 0 0 rgba(245,255,0,.45)}50%{box-shadow:0 0 30px rgba(245,255,0,.9),0 0 0 10px rgba(245,255,0,0)}}\n\n/* búsqueda + chips */\n.field{width:100%;background:#0d0d16;border:2px solid #2d2d45;color:#fff;padding:14px 16px;min-height:48px;font-family:'Courier Prime',monospace;font-size:16px;outline:none;transition:border-color .15s,box-shadow .15s}\n.field::placeholder{color:#8e8eab}\n.field:focus{border-color:#00f5ff;box-shadow:0 0 0 1px #00f5ff,0 0 18px rgba(0,245,255,.45)}\n.chip{font-family:'Press Start 2P',monospace;font-size:9px;padding:10px 12px;min-height:44px;background:transparent;border:2px solid #2d2d45;color:#b9b9d2}\n.chip:hover{border-color:#ff006e;color:#fff}\n.chip.on{border-color:#ff006e;color:#ff006e;box-shadow:0 0 10px rgba(255,0,110,.5);background:rgba(255,0,110,.08)}\n\n/* tarjetas */\n.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:24px;perspective:900px}\n@media (max-width:560px){.cards{grid-template-columns:repeat(1,minmax(0,1fr))}}\n.card{background:#0f0f19;border:2px solid rgba(0,245,255,.3);display:flex;flex-direction:column;transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;box-shadow:0 0 14px rgba(0,245,255,.08);transform-style:preserve-3d}\n.card:hover{transform:translateY(-8px) rotateX(5deg) rotateY(-4deg) scale(1.03);border-color:#00f5ff;box-shadow:0 0 22px rgba(0,245,255,.5),0 18px 40px rgba(0,0,0,.6)}\n.card:nth-child(even):hover{transform:translateY(-8px) rotateX(5deg) rotateY(4deg) scale(1.03)}\n.thumb{position:relative;aspect-ratio:16/10;overflow:hidden;border-bottom:2px solid rgba(255,255,255,.06)}\n.thumb::after{content:\"\";position:absolute;inset:0;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.22) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55))}\n.thumb svg{width:100%;height:100%;display:block}\n.th-ark{background:linear-gradient(160deg,#1a0820,#0a0a14)}\n.th-tet{background:linear-gradient(160deg,#071a22,#0a0a14)}\n.th-snk{background:linear-gradient(160deg,#0f1a06,#0a0a14)}\n.th-maz{background:linear-gradient(160deg,#08082a,#0a0a14)}\n.th-inv{background:linear-gradient(160deg,#1d0614,#0a0a14)}\n.th-ast{background:linear-gradient(160deg,#10101e,#05050a)}\n.badge{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(245,255,0,.5);padding:6px 8px;color:#f5ff00;font-size:13px}\n.tag{font-family:'Press Start 2P',monospace;font-size:8px;color:#ff5c9d;letter-spacing:.08em}\n\n/* transiciones de vista */\n.view{animation:viewin .32s ease both}\n@keyframes viewin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}\n.overlay{position:fixed;inset:0;z-index:60;background:rgba(5,5,9,.94);overflow-y:auto;animation:fadein .22s ease both}\n@keyframes fadein{from{opacity:0}to{opacity:1}}\n.slidein{animation:slidein .3s cubic-bezier(.2,.8,.2,1) both}\n@keyframes slidein{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}\n.detail-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:40px}\n@media (max-width:900px){.detail-grid{grid-template-columns:repeat(1,minmax(0,1fr))}}\n.panel-box{background:#0d0d16;border:2px solid #ff006e;box-shadow:0 0 22px rgba(255,0,110,.25),inset 0 0 30px rgba(255,0,110,.06)}\n.lb-row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px dashed #22223a;font-size:15px}\n.lb-row:last-child{border-bottom:0}\n\n/* salón de la fama */\n.tabs{display:flex;flex-wrap:wrap;gap:8px}\n.tab{font-family:'Press Start 2P',monospace;font-size:9px;padding:12px 14px;min-height:44px;background:transparent;border:2px solid #2d2d45;color:#b9b9d2}\n.tab:hover{color:#fff;border-color:#5a5a7a}\n.tab.on{color:#0a0a0f;background:#00f5ff;border-color:#00f5ff;box-shadow:0 0 16px rgba(0,245,255,.6)}\n.table-box{overflow-x:auto;border:2px solid rgba(0,245,255,.35);box-shadow:0 0 24px rgba(0,245,255,.12);background:rgba(13,13,22,.92)}\ntable.fame{width:100%;border-collapse:collapse;min-width:560px}\n.fame th{font-family:'Press Start 2P',monospace;font-size:9px;color:#8fe9ef;text-align:left;padding:16px;border-bottom:2px solid rgba(0,245,255,.35);font-weight:400}\n.fame td{padding:14px 16px;border-bottom:1px solid #1d1d30;font-size:17px}\n.fame th.num,.fame td.num{text-align:right}\n.frow{animation:rowin .45s ease both}\n@keyframes rowin{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}\n.d1{animation-delay:.04s}.d2{animation-delay:.09s}.d3{animation-delay:.14s}.d4{animation-delay:.19s}.d5{animation-delay:.24s}.d6{animation-delay:.29s}.d7{animation-delay:.34s}.d8{animation-delay:.39s}.d9{animation-delay:.44s}.d10{animation-delay:.49s}\n.gold td{color:#ffd84a;text-shadow:0 0 10px rgba(255,216,74,.55)}.gold{background:rgba(255,216,74,.06)}\n.silver td{color:#dde6f2;text-shadow:0 0 10px rgba(221,230,242,.45)}.silver{background:rgba(221,230,242,.04)}\n.bronze td{color:#ff9e5e;text-shadow:0 0 10px rgba(255,158,94,.5)}.bronze{background:rgba(255,158,94,.05)}\n.mine{outline:2px solid #ff006e;outline-offset:-2px;background:rgba(255,0,110,.1) !important}\n.rank{font-family:'Press Start 2P',monospace;font-size:11px}\n\n/* auth */\n.auth-card{width:100%;max-width:440px;background:#0d0d16;border:2px solid #00f5ff;box-shadow:0 0 30px rgba(0,245,255,.25),inset 0 0 40px rgba(0,245,255,.05);padding:32px 28px}\n.atab{flex:1;font-family:'Press Start 2P',monospace;font-size:9px;padding:14px 8px;min-height:48px;background:transparent;border:0;border-bottom:3px solid #2d2d45;color:#9a9ab8}\n.atab.on{color:#ff006e;border-bottom-color:#ff006e;text-shadow:0 0 8px rgba(255,0,110,.6)}\n.lbl{display:block;font-family:'Press Start 2P',monospace;font-size:9px;color:#8fe9ef;margin-bottom:10px}\n\n/* jugador / CRT */\n.bezel{background:linear-gradient(180deg,#1d1d2a,#121219);border-radius:34px;padding:26px;box-shadow:0 0 0 2px #2a2a3a,0 0 50px rgba(0,245,255,.18),0 30px 60px rgba(0,0,0,.7),inset 0 2px 0 rgba(255,255,255,.06);outline:none}\n.bezel:focus-visible{box-shadow:0 0 0 3px #00f5ff,0 0 50px rgba(0,245,255,.4),0 30px 60px rgba(0,0,0,.7)}\n.screen{position:relative;border-radius:22px / 26px;overflow:hidden;background:#050508;box-shadow:inset 0 0 40px rgba(0,0,0,.9),0 0 24px rgba(0,245,255,.25)}\n.screen canvas{display:block;width:100%;height:auto;image-rendering:pixelated}\n.screen::after{content:\"\";position:absolute;inset:0;pointer-events:none;border-radius:inherit;\n  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.28) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,rgba(255,255,255,.04),transparent 55%,rgba(0,0,0,.6) 100%)}\n.screen-msg{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(5,5,8,.78);text-align:center;padding:20px}\n.wipe{position:absolute;left:0;right:0;height:30%;top:-30%;background:linear-gradient(to bottom,transparent,rgba(0,245,255,.25),transparent);animation:wipe 1s linear infinite}\n@keyframes wipe{to{top:100%}}\n.spinner{display:grid;grid-template-columns:repeat(3,12px);gap:4px}\n.spinner span{width:12px;height:12px;background:#00f5ff;animation:pix 0.9s steps(1) infinite;opacity:.15}\n.spinner span:nth-child(1){animation-delay:0s}.spinner span:nth-child(2){animation-delay:.1s}.spinner span:nth-child(3){animation-delay:.2s}.spinner span:nth-child(6){animation-delay:.3s}.spinner span:nth-child(9){animation-delay:.4s}.spinner span:nth-child(8){animation-delay:.5s}.spinner span:nth-child(7){animation-delay:.6s}.spinner span:nth-child(4){animation-delay:.7s}.spinner span:nth-child(5){opacity:0;animation:none}\n@keyframes pix{0%{opacity:1;box-shadow:0 0 8px #00f5ff}30%{opacity:.15;box-shadow:none}}\n.hud{display:flex;flex-wrap:wrap;gap:12px 28px;justify-content:space-between;align-items:center;border:2px solid rgba(0,245,255,.35);background:rgba(13,13,22,.9);padding:14px 18px}\n.hud-k{font-family:'Press Start 2P',monospace;font-size:8px;color:#8fe9ef;display:block;margin-bottom:8px}\n.hud-v{font-family:'Press Start 2P',monospace;font-size:14px}\n.life{width:14px;height:14px;background:#ff006e;box-shadow:0 0 8px #ff006e;display:inline-block}\n.life.off{background:#2a2a3d;box-shadow:none}\n.dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px);gap:6px}\n.dbtn{width:52px;height:52px;background:#14141f;border:2px solid #3a3a52;color:#00f5ff;display:flex;align-items:center;justify-content:center}\n.dbtn:active{transform:scale(.92);border-color:#00f5ff}\n.modal-card{width:100%;max-width:520px;background:#0d0d16;border:2px solid #ff006e;box-shadow:0 0 40px rgba(255,0,110,.4),inset 0 0 40px rgba(255,0,110,.08);padding:36px 28px;text-align:center}\n.type{display:inline-block;overflow:hidden;white-space:nowrap;border-right:3px solid #f5ff00;width:0;animation:typing 1.4s steps(20) .1s forwards,caret .7s steps(1) infinite}\n@keyframes typing{to{width:20ch}}\n@keyframes caret{50%{border-color:transparent}}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div class=\"{{rootClass}}\" style=\"position: relative; min-height: 100vh; overflow: hidden; backgr Fsc-for>\n            <\u002Fsc-raw-tbody>\n          <\u002Fsc-raw-table>\n        <\u002Fdiv>\n        <p style=\"margin: 0; color: #8e8eab; font-size: 14px\">Las marcas de invitado se guardan solo en este dispositivo. Las cuentas registradas compiten en el ranking global.<\u002Fp>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <!-- ============ AUTENTICACIÓN ============ -->\n    <sc-if value=\"{{showAuth}}\" hint-placeholder-val=\"{{ false }}\">\n      <section class=\"view\" style=\"min-height: calc(100vh - 66px); display: flex; align-items: center; justify-content: center; padding: 48px 20px 96px\">\n        <div class=\"auth-card\">\n          <div style=\"text-align: center; margin-bottom: 26px; display: flex; flex-direction: column; gap: 12px\">\n            <span class=\"px flicker\" style=\"font-size: 20px\"><span class=\"neon-c\">ARCADE<\u002Fspan> <span class=\"neon-m\">VAULT<\u002Fspan><\u002Fspan>\n            <span class=\"px neon-y\" style=\"font-size: 8px\">JUGADOR 1, PREPÁRATE<\u002Fspan>\n          <\u002Fdiv>\n          <div role=\"tablist\" aria-label=\"Acceso\" style=\"display: flex; margin-bottom: 24px\">\n            <button class=\"{{loginTabClass}}\" role=\"tab\" aria-selected=\"{{isLogin}}\" sc-camel-on-click=\"{{toLogin}}\">INICIAR SESIÓN<\u002Fbutton>\n            <button class=\"{{regTabClass}}\" role=\"tab\" aria-selected=\"{{isRegister}}\" sc-camel-on-click=\"{{toRegister}}\">CREAR CUENTA<\u002Fbutton>\n          <\u002Fdiv>\n          <form sc-camel-on-submit=\"{{submitAuth}}\" style=\"display: flex; flex-direction: column; gap: 18px\" novalidate=\"\">\n            <div>\n              <label class=\"lbl\" for=\"av-user\">Usuario<\u002Flabel>\n              <input id=\"av-user\" class=\"field\" type=\"text\" autocomplete=\"username\" placeholder=\"Tu alias de jugador\" value=\"{{fUser}}\" sc-camel-on-input=\"{{onUser}}\">\n            <\u002Fdiv>\n            <sc-if value=\"{{isRegister}}\" hint-placeholder-val=\"{{ false }}\">\n              <div>\n                <label class=\"lbl\" for=\"av-mail\">Correo electrónico<\u002Flabel>\n                <input id=\"av-mail\" class=\"field\" type=\"email\" autocomplete=\"email\" placeholder=\"tucorreo@ejemplo.com\" value=\"{{fMail}}\" sc-camel-on-input=\"{{onMail}}\">\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <div>\n              <label class=\"lbl\" for=\"av-pass\">Contraseña<\u002Flabel>\n              <input id=\"av-pass\" class=\"field\" type=\"password\" autocomplete=\"current-password\" placeholder=\"Mínimo 6 caracteres\" value=\"{{fPass}}\" sc-camel-on-input=\"{{onPass}}\">\n            <\u002Fdiv>\n            <sc-if value=\"{{hasAuthError}}\" hint-placeholder-val=\"{{ false }}\">\n              <p role=\"alert\" style=\"margin: 0; color: #ff5c9d; font-size: 15px\">{{authError}}<\u002Fp>\n            <\u002Fsc-if>\n            <button type=\"submit\" class=\"btn btn-solid\" style=\"width: 100%\" disabled=\"{{authBusy}}\">{{submitLabel}}<\u002Fbutton>\n          <\u002Fform>\n          <div style=\"display: flex; align-items: center; gap: 12px; margin: 24px 0 18px; color: #8e8eab; font-size: 13px\">\n            <span style=\"flex-grow: 1; height: 1px; background: #2d2d45\"><\u002Fspan>O CONTINÚA CON<span style=\"flex-grow: 1; height: 1px; background: #2d2d45\"><\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px\">\n            <button class=\"btn btn-ghost\" style=\"font-size: 9px\" sc-camel-on-click=\"{{socialGoogle}}\">Google<\u002Fbutton>\n            <button class=\"btn btn-ghost\" style=\"font-size: 9px\" sc-camel-on-click=\"{{socialGithub}}\">GitHub<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"margin-top: 24px; padding-top: 22px; border-top: 2px dashed #2d2d45; display: flex; flex-direction: column; gap: 10px; align-items: center; text-align: center\">\n            <button class=\"btn btn-y\" style=\"width: 100%\" sc-camel-on-click=\"{{playGuest}}\">Jugar como invitado<\u002Fbutton>\n            <span style=\"color: #b9b9d2; font-size: 14px\">Sin cuenta. Tus puntuaciones no entran al ranking global.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <!-- ============ JUGADOR ============ -->\n    <sc-if value=\"{{showPlayer}}\" hint-placeholder-val=\"{{ false }}\">\n      <section class=\"view\" style=\"max-width: 760px; margin: 0 auto; padding: 20px 16px 64px; display: flex; flex-direction: column; gap: 16px\">\n        <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap\">\n          <div style=\"display: flex; flex-direction: column; gap: 8px\">\n            <span class=\"px\" style=\"font-size: 8px; color: #8e8eab\">ARCADE VAULT · AHORA JUGANDO<\u002Fspan>\n            <span class=\"px neon-c\" style=\"font-size: 16px\">{{gameTitle}}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; gap: 10px\">\n            <button class=\"btn btn-y\" sc-camel-on-click=\"{{togglePause}}\" disabled=\"{{pauseDisabled}}\">{{pauseLabel}}<\u002Fbutton>\n            <button class=\"btn btn-m\" sc-camel-on-click=\"{{exitGame}}\">Salir<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"hud\" aria-live=\"polite\">\n          <div><span class=\"hud-k\">PUNTUACIÓN<\u002Fspan><span class=\"hud-v neon-y\">{{scoreFmt}}<\u002Fspan><\u002Fdiv>\n          <div><span class=\"hud-k\">VIDAS<\u002Fspan><span style=\"display: flex; gap: 6px\"><sc-for list=\"{{lifeDots}}\" as=\"l\" hint-placeholder-count=\"3\"><span class=\"{{l.cls}}\"><\u002Fspan><\u002Fsc-for><\u002Fspan><\u002Fdiv>\n          <div><span class=\"hud-k\">NIVEL<\u002Fspan><span class=\"hud-v neon-c\">{{levelFmt}}<\u002Fspan><\u002Fdiv>\n          <div><span class=\"hud-k\">JUGADOR<\u002Fspan><span class=\"hud-v\" style=\"font-size: 11px; color: #ff5c9d\">{{playerName}}<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"bezel\" sc-camel-tab-index=\"0\" ref=\"{{bezelRef}}\" sc-camel-on-key-down=\"{{onKey}}\" aria-label=\"Pantalla de juego. Usa las flechas o WASD para moverte y P para pausar.\">\n          <div class=\"screen\">\n            <canvas ref=\"{{canvasRef}}\" width=\"480\" height=\"480\" aria-hidden=\"true\"><\u002Fcanvas>\n            <sc-if value=\"{{loading}}\" hint-placeholder-val=\"{{ false }}\">\n              <div class=\"screen-msg\" style=\"background: #050508\">\n                <div class=\"wipe\"><\u002Fdiv>\n                <div class=\"spinner\" aria-hidden=\"true\"><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><\u002Fdiv>\n                <span class=\"px neon-c\" style=\"font-size: 10px\">CARGANDO CARTUCHO…<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{paused}}\" hint-placeholder-val=\"{{ false }}\">\n              <div class=\"screen-msg\">\n                <span class=\"px neon-y blink\" style=\"font-size: 18px\">PAUSA<\u002Fspan>\n                <span style=\"color: #b9b9d2\">Pulsa P o el botón para continuar<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap\">\n          <p style=\"margin: 0; color: #b9b9d2; font-size: 14px; line-height: 1.5; max-width: 380px\">Flechas o WASD para moverte · P para pausar.<br>Cartucho de demostración: el archivo HTML de cada juego se carga en este marco dentro de un iframe aislado (sandbox).<\u002Fp>\n          <div class=\"dpad\" role=\"group\" aria-label=\"Controles táctiles\">\n            <span><\u002Fspan>\n            <button class=\"dbtn\" sc-camel-on-click=\"{{dUp}}\" aria-label=\"Arriba\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 18 18\" aria-hidden=\"true\"><path d=\"M9 3L16 13H2Z\" fill=\"#00f5ff\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n            <span><\u002Fspan>\n            <button class=\"dbtn\" sc-camel-on-click=\"{{dLeft}}\" aria-label=\"Izquierda\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 18 18\" aria-hidden=\"true\"><path d=\"M3 9L13 2V16Z\" fill=\"#00f5ff\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n            <button class=\"dbtn\" sc-camel-on-click=\"{{dDown}}\" aria-label=\"Abajo\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 18 18\" aria-hidden=\"true\"><path d=\"M9 15L2 5H16Z\" fill=\"#00f5ff\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n            <button class=\"dbtn\" sc-camel-on-click=\"{{dRight}}\" aria-label=\"Derecha\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 18 18\" aria-hidden=\"true\"><path d=\"M15 9L5 16V2Z\" fill=\"#00f5ff\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n  <\u002Fmain>\n\n  <!-- ============ DETALLE (overlay) ============ -->\n  <sc-if value=\"{{detailOpen}}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"overlay\" role=\"dialog\" aria-modal=\"true\" aria-label=\"{{dTitle}}\">\n      <div class=\"slidein\" style=\"max-width: 1180px; margin: 0 auto; padding: 40px 20px 80px\">\n        <button class=\"btn btn-ghost\" style=\"margin-bottom: 32px\" sc-camel-on-click=\"{{closeDetail}}\">← Volver al Vault<\u002Fbutton>\n        <div class=\"detail-grid\">\n          <div style=\"display: flex; flex-direction: column; gap: 22px\">\n            <span class=\"tag\" style=\"font-size: 10px\">{{dCategory}}<\u002Fspan>\n            <h1 class=\"px neon-c flicker\" style=\"margin: 0; font-size: clamp(26px, 5vw, 52px); line-height: 1.2; font-weight: 400\">{{dTitle}}<\u002Fh1>\n            <p style=\"margin: 0; color: #d0d0e4; font-size: 18px; line-height: 1.6; max-width: 620px\">{{dDesc}}<\u002Fp>\n            <div style=\"display: flex; flex-wrap: wrap; gap: 24px; color: #b9b9d2; font-size: 15px\">\n              <span><span class=\"px\" style=\"font-size: 8px; color: #8fe9ef\">CONTROLES<\u002Fspan><br>{{dControls}}<\u002Fspan>\n              <span><span class=\"px\" style=\"font-size: 8px; color: #8fe9ef\">MEJOR PUNTUACIÓN<\u002Fspan><br><strong class=\"neon-y\">{{dBest}}<\u002Fstrong><\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px\">\n              <button class=\"btn btn-solid pulse\" style=\"font-size: 14px; padding: 20px 28px\" sc-camel-on-click=\"{{playNow}}\">Jugar ahora<\u002Fbutton>\n              <button class=\"btn btn-m\" style=\"padding: 20px 22px\" sc-camel-on-click=\"{{closeDetail}}\">Volver al Vault<\u002Fbutton>\n            <\u002Fdiv>\n            <sc-if value=\"{{loggedOut}}\" hint-placeholder-val=\"{{ true }}\">\n              <p style=\"margin: 0; color: #8e8eab; font-size: 14px\">Jugarás como invitado. <button style=\"background: none; border: 0; padding: 0; color: #00f5ff; text-decoration: underline; min-height: 24px\" sc-camel-on-click=\"{{goAuth}}\">Inicia sesión<\u002Fbutton> para entrar al ranking global.<\u002Fp>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <aside class=\"panel-box\" aria-label=\"Mejores puntuaciones\">\n            <div style=\"padding: 18px; border-bottom: 2px solid #ff006e; display: flex; justify-content: space-between; align-items: center\">\n              <h2 class=\"px neon-m\" style=\"margin: 0; font-size: 11px; font-weight: 400\">MEJORES PUNTUACIONES<\u002Fh2>\n              <span class=\"px\" style=\"font-size: 8px; color: #8e8eab\">TOP 10<\u002Fspan>\n            <\u002Fdiv>\n            <ol style=\"list-style: none; margin: 0; padding: 4px 0\">\n              <sc-for list=\"{{dRows}}\" as=\"r\" hint-placeholder-count=\"10\">\n                <li class=\"{{r.lbCls}}\">\n                  <span class=\"rank\" style=\"color: #8fe9ef\">{{r.rank}}<\u002Fspan>\n                  <span style=\"min-width: 0\"><strong style=\"display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap\">{{r.name}}<\u002Fstrong><span style=\"color: #8e8eab; font-size: 13px\">{{r.date}}<\u002Fspan><\u002Fspan>\n                  <span class=\"px neon-y\" style=\"font-size: 11px\">{{r.score}}<\u002Fspan>\n                <\u002Fli>\n              <\u002Fsc-for>\n            <\u002Fol>\n          <\u002Faside>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ FIN DEL JUEGO (modal) ============ -->\n  <sc-if value=\"{{over}}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"overlay\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Fin del juego\" style=\"display: flex; align-items: center; justify-content: center; padding: 20px\">\n      <div class=\"modal-card slidein\" style=\"display: flex; flex-direction: column; gap: 20px; align-items: center\">\n        <span class=\"px\" style=\"font-size: 9px; color: #8e8eab\">GAME OVER<\u002Fspan>\n        <h2 class=\"px neon-m flicker\" style=\"margin: 0; font-size: clamp(20px, 5vw, 30px); font-weight: 400\">FIN DEL JUEGO<\u002Fh2>\n        <div>\n          <span class=\"px\" style=\"font-size: 9px; color: #8fe9ef\">PUNTUACIÓN FINAL<\u002Fspan>\n          <p class=\"px neon-y\" style=\"margin: 12px 0 0; font-size: 30px\">{{scoreFmt}}<\u002Fp>\n        <\u002Fdiv>\n        <sc-if value=\"{{notSaved}}\" hint-placeholder-val=\"{{ true }}\">\n          <button class=\"btn btn-y\" sc-camel-on-click=\"{{saveScore}}\" disabled=\"{{saving}}\">{{saveLabel}}<\u002Fbutton>\n        <\u002Fsc-if>\n        <sc-if value=\"{{saved}}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display: flex; flex-direction: column; gap: 10px; align-items: center\">\n            <span class=\"px neon-y type\" style=\"font-size: 12px\">PUNTUACIÓN GUARDADA<\u002Fspan>\n            <span style=\"color: #b9b9d2; font-size: 14px\">{{savedNote}}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 6px\">\n          <button class=\"btn\" sc-camel-on-click=\"{{playAgain}}\">Jugar de nuevo<\u002Fbutton>\n          <button class=\"btn btn-m\" sc-camel-on-click=\"{{backToVault}}\">Volver al Vault<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;scanlines&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;section&quot;:&quot;Efectos&quot;},&quot;animatedGrid&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;section&quot;:&quot;Efectos&quot;},&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:1500}}\">\nvar AV_GAMES = [\n  { id: 'ark', title: 'ARKANOID', category: 'ROMPELADRILLOS', thumb: 'th-ark', color: '#ff006e',\n    short: 'Rebota la bola y pulveriza cada muro de ladrillos.',\n    desc: 'Controla la nave Vaus y devuelve la bola para destruir cada fila de ladrillos. Atrapa las cápsulas de poder para alargar tu paleta o disparar láseres. Si la bola se escapa, pierdes una vida.',\n    controls: '← → mover · Espacio lanzar', base: 48200 },\n  { id: 'tet', title: 'TETRIS', category: 'PUZLE', thumb: 'th-tet', color: '#00f5ff',\n    short: 'Encaja las piezas y limpia líneas sin parar.',\n    desc: 'Gira y coloca las piezas que caen para completar líneas horizontales. Cada línea limpia suma puntos y acelera el ritmo. Si las piezas tocan el techo, se acabó la partida.',\n    controls: '← → mover · ↑ girar · ↓ bajar', base: 129800 },\n  { id: 'snk', title: 'SNAKE', category: 'CLÁSICO', thumb: 'th-snk', color: '#34ff7a',\n    short: 'Come, crece y no te muerdas la cola.',\n    desc: 'Guía a la serpiente por la cuadrícula y devora cada punto de energía. Con cada bocado creces y la velocidad aumenta. Chocar contra un muro o contra tu propio cuerpo cuesta una vida.',\n    controls: 'Flechas o WASD · P pausa', base: 2350 },\n  { id: 'maz', title: 'PAC-MAN', category: 'LABERINTO', thumb: 'th-maz', color: '#f5ff00',\n    short: 'Recorre el laberinto y huye de los fantasmas.',\n    desc: 'Come todos los puntos del laberinto mientras esquivas a cuatro fantasmas implacables. Las píldoras de poder te dan unos segundos para cazarlos. Limpia el tablero para pasar de nivel.',\n    controls: 'Flechas para moverte', base: 86400 },\n  { id: 'inv', title: 'SPACE INVADERS', category: 'DISPAROS', thumb: 'th-inv', color: '#ff006e',\n    short: 'Defiende la Tierra de la flota invasora.',\n    desc: 'Una flota alienígena desciende fila tras fila. Muévete tras tus búnkeres, dispara y elimínalos antes de que toquen el suelo. Cuantos menos quedan, más rápido avanzan.',\n    controls: '← → mover · Espacio disparar', base: 15600 },\n  { id: 'ast', title: 'ASTEROIDS', category: 'DISPAROS', thumb: 'th-ast', color: '#00f5ff',\n    short: 'Pilota en el vacío y parte cada roca espacial.',\n    desc: 'Tu nave flota en un campo de asteroides. Gira, impulsa y dispara para partir las rocas en fragmentos cada vez más pequeños. Cuidado con los platillos enemigos y con tu propia inercia.',\n    controls: '← → girar · ↑ impulso · Espacio disparar', base: 31900 }\n];\nvar AV_NAMES = ['NEONKID', 'PIXELA', 'B1TMAP', 'KOMETA', 'RAYO_X', 'LUNA8', 'ZETA', 'MOXI', 'GLITCH', 'VOLTIO', 'CRTGIRL', 'TURBO'];\nvar AV_N = 20, AV_CELL = 24;\n\nfunction avPad(n, w) { var s = String(Math.max(0, Math.floor(n))); while (s.length < w) s = '0' + s; return s; }\nfunction avToday() { var d = new Date(); return avPad(d.getDate(), 2) + '/' + avPad(d.getMonth() + 1, 2) + '/' + d.getFullYear(); }\nfunction avSeed() {\n  var out = {};\n  AV_GAMES.forEach(function (g, gi) {\n    var list = [];\n    for (var i = 0; i < 10; i++) {\n      var drop = Math.round(g.base * (0.07 + ((i * 7 + gi * 3) % 5) * 0.01));\n      list.push({ name: AV_NAMES[(i + gi * 2) % AV_NAMES.length], score: g.base - i * drop, date: avPad(((i * 5 + gi * 3) % 25) + 1, 2) + '/' + avPad(((i + gi) % 3) + 8, 2) + '/2026' });\n    }\n    out[g.id] = list;\n  });\n  return out;\n}\nvar AV_KEY = 'arcadevault.scores.v1';\nfunction avLoadLocal() { try { var raw = window.localStorage.getItem(AV_KEY); return raw ? JSON.parse(raw) : []; } catch (e) { return []; } }\nfunction avSaveLocal(list) { try { window.localStorage.setItem(AV_KEY, JSON.stringify(list)); } catch (e) {} }\n\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    var scores = avSeed();\n    avLoadLocal().forEach(function (e) { if (scores[e.game]) scores[e.game].push(e); });\n    this.state = {\n      view: 'library', detail: null, menuOpen: false, query: '', cat: 'TODOS', fameGame: 'ark',\n      user: null, authMode: 'login', fUser: '', fMail: '', fPass: '', authError: '', authBusy: false,\n      scores: scores, playing: null, loading: false, paused: false, over: false, saved: false, saving: false,\n      score: 0, lives: 3, level: 1\n    };\n    this.g = null; this.loop = null; this.timers = [];\n  }\n  componentWillUnmount() { this.stopLoop(); this.timers.forEach(clearTimeout); }\n  later(fn, ms) { this.timers.push(setTimeout(fn, ms)); }\n\n  /* ---------- navegación ---------- */\n  go(view) { this.stopLoop(); this.setState({ view: view, detail: null, menuOpen: false, over: false, paused: false }); try { window.scrollTo(0, 0); } catch (e) {} }\n\n  /* ---------- puntuaciones ---------- */\n  top(id) { return (this.state.scores[id] || []).slice().sort(function (a, b) { return b.score - a.score; }).slice(0, 10); }\n  best(id) { var t = this.top(id); return t.length ? t[0].score : 0; }\n\n  /* ---------- motor de demostración (Snake) ----------\n     En producción este bloque se sustituye por <iframe sandbox=\"allow-scripts\" src=\"/games/<id>/index.html\">\n     y el juego informa la puntuación con window.parent.postMessage({type:'av:score', score, lives, level}, '*'). */\n  startGame() {\n    var mid = Math.floor(AV_N / 2);\n    this.g = { snake: [{ x: mid, y: mid }, { x: mid - 1, y: mid }, { x: mid - 2, y: mid }], dir: { x: 1, y: 0 }, next: { x: 1, y: 0 }, food: null, eaten: 0, speed: 140, flash: 0 };\n    this.placeFood();\n    this.setState({ score: 0, lives: 3, level: 1, over: false, paused: false, saved: false, saving: false });\n    this.runLoop(); this.draw();\n    if (this.bezel) { try { this.bezel.focus(); } catch (e) {} }\n  }\n  runLoop() { this.stopLoop(); var self = this; this.loop = setInterval(function () { self.tick(); }, this.g.speed); }\n  stopLoop() { if (this.loop) { clearInterval(this.loop); this.loop = null; } }\n  placeFood() {\n    var g = this.g, f;\n    do { f = { x: Math.floor(Math.random() * AV_N), y: Math.floor(Math.random() * AV_N) }; }\n    while (g.snake.some(function (s) { return s.x === f.x && s.y === f.y; }));\n    g.food = f;\n  }\n  resetSnake() { var mid = Math.floor(AV_N / 2); this.g.snake = [{ x: mid, y: mid }, { x: mid - 1, y: mid }, { x: mid - 2, y: mid }]; this.g.dir = { x: 1, y: 0 }; this.g.next = { x: 1, y: 0 }; }\n  tick() {\n    var g = this.g; if (!g) return;\n    g.dir = g.next;\n    var h = g.snake[0], nh = { x: h.x + g.dir.x, y: h.y + g.dir.y };\n    var hit = nh.x < 0 || nh.y < 0 || nh.x >= AV_N || nh.y >= AV_N || g.snake.some(function (s) { return s.x === nh.x && s.y === nh.y; });\n    if (hit) { this.loseLife(); return; }\n    g.snake.unshift(nh);\n    if (nh.x === g.food.x && nh.y === g.food.y) {\n      g.eaten++;\n      var level = 1 + Math.floor(g.eaten / 5);\n      var score = this.state.score + 10 * level;\n      this.placeFood();\n      if (level !== this.state.level) { g.speed = Math.max(60, 140 - (level - 1) * 14); this.runLoop(); }\n      this.setState({ score: score, level: level });\n    } else { g.snake.pop(); }\n    if (g.flash > 0) g.flash--;\n    this.draw();\n  }\n  loseLife() {\n    var lives = this.state.lives - 1;\n    this.g.flash = 4;\n    if (lives <= 0) { this.stopLoop(); this.draw(); this.setState({ lives: 0, over: true }); return; }\n    this.resetSnake(); this.draw(); this.setState({ lives: lives });\n  }\n  setDir(x, y) {\n    var g = this.g; if (!g || this.state.paused || this.state.over || this.state.loading) return;\n    if (g.dir.x === -x && g.dir.y === -y) return;\n    g.next = { x: x, y: y };\n  }\n  draw() {\n    var c = this.canvas; if (!c || !c.getContext) return;\n    var ctx = c.getContext('2d'), S = AV_CELL, g = this.g;\n    var game = AV_GAMES.find(function (x) { return x.id === this.state.playing; }, this) || AV_GAMES[2];\n    ctx.fillStyle = '#050508'; ctx.fillRect(0, 0, c.width, c.height);\n    ctx.strokeStyle = 'rgba(0,245,255,0.06)'; ctx.lineWidth = 1;\n    for (var i = 0; i <= AV_N; i++) { ctx.beginPath(); ctx.moveTo(i * S + .5, 0); ctx.lineTo(i * S + .5, c.height); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0, i * S + .5); ctx.lineTo(c.width, i * S + .5); ctx.stroke(); }\n    if (!g) {\n      ctx.fillStyle = '#00f5ff'; ctx.font = '14px \"Press Start 2P\", monospace'; ctx.textAlign = 'center';\n      ctx.fillText('LISTO', c.width / 2, c.height / 2); return;\n    }\n    if (g.flash > 0) { ctx.fillStyle = 'rgba(255,0,110,0.18)'; ctx.fillRect(0, 0, c.width, c.height); }\n    ctx.shadowBlur = 14; ctx.shadowColor = '#ff006e'; ctx.fillStyle = '#ff006e';\n    ctx.fillRect(g.food.x * S + 5, g.food.y * S + 5, S - 10, S - 10);\n    ctx.shadowColor = game.color; ctx.fillStyle = game.color;\n    g.snake.forEach(function (s, idx) { ctx.globalAlpha = idx === 0 ? 1 : Math.max(0.45, 1 - idx * 0.03); ctx.fillRect(s.x * S + 2, s.y * S + 2, S - 4, S - 4); });\n    ctx.globalAlpha = 1; ctx.shadowBlur = 0;\n  }\n\n  renderVals() {\n    var self = this, st = this.state;\n    var q = st.query.trim().toLowerCase();\n    var cats = ['TODOS', 'PUZLE', 'DISPAROS', 'LABERINTO', 'ROMPELADRILLOS', 'CLÁSICO'];\n    var filtered = AV_GAMES.filter(function (g) {\n      var okCat = st.cat === 'TODOS' || g.category === st.cat;\n      var okQ = !q || g.title.toLowerCase().indexOf(q) >= 0 || g.category.toLowerCase().indexOf(q) >= 0 || g.short.toLowerCase().indexOf(q) >= 0;\n      return okCat && okQ;\n    }).map(function (g) {\n      return {\n        title: g.title, category: g.category, short: g.short, thumbClass: 'thumb ' + g.thumb,\n        isArk: g.id === 'ark', isTet: g.id === 'tet', isSnk: g.id === 'snk', isMaz: g.id === 'maz', isInv: g.id === 'inv', isAst: g.id === 'ast',\n        best: avPad(self.best(g.id), 6), playLabel: 'Jugar a ' + g.title,\n        open: function () { self.setState({ detail: g.id }); }\n      };\n    });\n    var user = st.user;\n    var game = AV_GAMES.find(function (g) { return g.id === st.detail; });\n    var playing = AV_GAMES.find(function (g) { return g.id === st.playing; });\n    var fameGame = AV_GAMES.find(function (g) { return g.id === st.fameGame; });\n    var rowsFor = function (id) {\n      return self.top(id).map(function (e, i) {\n        var mine = !!(user && e.name === user.name);\n        var medal = i === 0 ? ' gold' : i === 1 ? ' silver' : i === 2 ? ' bronze' : '';\n        return { rank: avPad(i + 1, 2), name: e.name, score: avPad(e.score, 6), date: e.date, mine: mine,\n          cls: 'frow d' + (i + 1) + medal + (mine ? ' mine' : ''), lbCls: 'lb-row' + medal + (mine ? ' mine' : '') };\n      });\n    };\n    var mineAll = user ? (st.scores[st.fameGame] || []).filter(function (e) { return e.name === user.name; }) : [];\n    var myBestVal = mineAll.reduce(function (m, e) { return Math.max(m, e.score); }, 0);\n    var myRank = myBestVal ? self.top(st.fameGame).findIndex(function (e) { return e.name === user.name && e.score === myBestVal; }) : -1;\n    var loggedIn = !!user;\n    var isPlayer = st.view === 'player';\n    var lifeDots = [0, 1, 2].map(function (i) { return { cls: i < st.lives ? 'life' : 'life off' }; });\n    var setDir = function (x, y) { return function () { self.setDir(x, y); }; };\n\n    return {\n      rootClass: (this.props.scanlines ?? true ? 'scan ' : '') + (this.props.animatedGrid ?? true ? 'grid-anim' : ''),\n      showNav: !isPlayer, showLibrary: st.view === 'library', showFame: st.view === 'fame', showAuth: st.view === 'auth', showPlayer: isPlayer,\n      navLibClass: 'nav-link' + (st.view === 'library' ? ' on' : ''), navFameClass: 'nav-link' + (st.view === 'fame' ? ' on' : ''),\n      pLibClass: 'panel-link' + (st.view === 'library' ? ' on' : ''), pFameClass: 'panel-link' + (st.view === 'fame' ? ' on' : ''),\n      panelClass: 'panel' + (st.menuOpen ? ' open' : ''), menuOpen: st.menuOpen,\n      openMenu: function () { self.setState({ menuOpen: true }); }, closeMenu: function () { self.setState({ menuOpen: false }); },\n      goLibrary: function () { self.go('library'); }, goFame: function () { self.go('fame'); }, goAuth: function () { self.go('auth'); },\n      loggedIn: loggedIn, loggedOut: !loggedIn, userName: user ? user.name : '', userInitial: user ? user.name.charAt(0) : '',\n      logout: function () { /* Backend: supabase.auth.signOut() */ self.setState({ user: null, menuOpen: false }); },\n\n      query: st.query, onQuery: function (e) { self.setState({ query: e.target.value }); },\n      chips: cats.map(function (c) { return { label: c, cls: 'chip' + (st.cat === c ? ' on' : ''), pressed: st.cat === c ? 'true' : 'false', pick: function () { self.setState({ cat: c }); } }; }),\n      filtered: filtered, noResults: filtered.length === 0,\n      countLabel: filtered.length + (filtered.length === 1 ? ' JUEGO DISPONIBLE' : ' JUEGOS DISPONIBLES'),\n      clearFilters: function () { self.setState({ query: '', cat: 'TODOS' }); },\n\n      detailOpen: !!game && !st.over,\n      dTitle: game ? game.title : '', dCategory: game ? game.category : '', dDesc: game ? game.desc : '', dControls: game ? game.controls : '',\n      dBest: game ? avPad(self.best(game.id), 6) : '', dRows: game ? rowsFor(game.id) : [],\n      closeDetail: function () { self.setState({ detail: null }); },\n      playNow: function () {\n        var id = st.detail;\n        self.setState({ view: 'player', playing: id, detail: null, loading: true, over: false, paused: false, score: 0, lives: 3, level: 1 });\n        self.g = null; self.draw();\n        self.later(function () { self.setState({ loading: false }); self.startGame(); }, 1100);\n      },\n\n      fameTabs: AV_GAMES.map(function (g) { return { title: g.title, cls: 'tab' + (st.fameGame === g.id ? ' on' : ''), selected: st.fameGame === g.id ? 'true' : 'false', pick: function () { self.setState({ fameGame: g.id }); } }; }),\n      fameGame: st.fameGame, fameTitle: fameGame ? fameGame.title : '', fameRows: rowsFor(st.fameGame),\n      myBest: myBestVal ? avPad(myBestVal, 6) : '------',\n      myBestNote: myBestVal ? (myRank >= 0 ? '(puesto ' + (myRank + 1) + ' del top 10)' : '(fuera del top 10, ¡sigue intentándolo!)') : 'Aún sin marca en este juego',\n\n      isLogin: st.authMode === 'login', isRegister: st.authMode === 'register',\n      loginTabClass: 'atab' + (st.authMode === 'login' ? ' on' : ''), regTabClass: 'atab' + (st.authMode === 'register' ? ' on' : ''),\n      toLogin: function () { self.setState({ authMode: 'login', authError: '' }); }, toRegister: function () { self.setState({ authMode: 'register', authError: '' }); },\n      fUser: st.fUser, fMail: st.fMail, fPass: st.fPass,\n      onUser: function (e) { self.setState({ fUser: e.target.value }); }, onMail: function (e) { self.setState({ fMail: e.target.value }); }, onPass: function (e) { self.setState({ fPass: e.target.value }); },\n      hasAuthError: !!st.authError, authError: st.authError, authBusy: st.authBusy,\n      submitLabel: st.authBusy ? 'VERIFICANDO…' : (st.authMode === 'login' ? 'INICIAR SESIÓN' : 'CREAR CUENTA'),\n      submitAuth: function (e) {\n        if (e && e.preventDefault) e.preventDefault();\n        var u = st.fUser.trim();\n        if (!u) { self.setState({ authError: 'Escribe tu usuario para continuar.' }); return; }\n        if (st.authMode === 'register' && st.fMail.indexOf('@') < 1) { self.setState({ authError: 'Revisa el correo electrónico.' }); return; }\n        if (st.fPass.length < 6) { self.setState({ authError: 'La contraseña necesita al menos 6 caracteres.' }); return; }\n        /* Backend: supabase.auth.signInWithPassword({ email, password }) o supabase.auth.signUp(...)\n           — o REST: POST /api/auth/login | /api/auth/register → { token, user } */\n        self.setState({ authBusy: true, authError: '' });\n        self.later(function () { self.setState({ authBusy: false, user: { name: u.toUpperCase().slice(0, 12) }, fPass: '', view: 'library' }); }, 800);\n      },\n      socialGoogle: function () { /* Backend: supabase.auth.signInWithOAuth({ provider: 'google' }) */ self.setState({ user: { name: 'JUGADOR_G' }, view: 'library' }); },\n      socialGithub: function () { /* Backend: supabase.auth.signInWithOAuth({ provider: 'github' }) */ self.setState({ user: { name: 'JUGADOR_GH' }, view: 'library' }); },\n      playGuest: function () { self.setState({ user: null }); self.go('library'); },\n\n      gameTitle: playing ? playing.title : '', scoreFmt: avPad(st.score, 6), levelFmt: avPad(st.level, 2), lifeDots: lifeDots,\n      playerName: user ? user.name : 'INVITADO', loading: st.loading, paused: st.paused,\n      pauseLabel: st.paused ? 'Seguir' : 'Pausa', pauseDisabled: st.loading || st.over,\n      togglePause: function () {\n        if (st.loading || st.over) return;\n        if (st.paused) { self.setState({ paused: false }); self.runLoop(); if (self.bezel) self.bezel.focus(); }\n        else { self.stopLoop(); self.setState({ paused: true }); }\n      },\n      exitGame: function () { self.stopLoop(); self.g = null; self.setState({ view: 'library', detail: st.playing, playing: null, paused: false, over: false }); },\n      canvasRef: this._cref || (this._cref = function (el) { self.canvas = el; if (el) self.draw(); }),\n      bezelRef: this._bref || (this._bref = function (el) { self.bezel = el; }),\n      onKey: function (e) {\n        var k = e.key;\n        var map = { ArrowUp: [0, -1], w: [0, -1], W: [0, -1], ArrowDown: [0, 1], s: [0, 1], S: [0, 1], ArrowLeft: [-1, 0], a: [-1, 0], A: [-1, 0], ArrowRight: [1, 0], d: [1, 0], D: [1, 0] };\n        if (map[k]) { e.preventDefault(); self.setDir(map[k][0], map[k][1]); }\n        else if (k === 'p' || k === 'P') { e.preventDefault(); if (!self.state.loading && !self.state.over) { if (self.state.paused) { self.setState({ paused: false }); self.runLoop(); } else { self.stopLoop(); self.setState({ paused: true }); } } }\n      },\n      dUp: setDir(0, -1), dDown: setDir(0, 1), dLeft: setDir(-1, 0), dRight: setDir(1, 0),\n\n      over: st.over, saved: st.saved, notSaved: !st.saved, saving: st.saving,\n      saveLabel: st.saving ? 'GUARDANDO…' : 'GUARDAR PUNTUACIÓN',\n      savedNote: user ? 'Enviada al ranking global como ' + user.name + '.' : 'Guardada como INVITADO solo en este dispositivo.',\n      saveScore: function () {\n        if (st.saving || st.saved) return;\n        var entry = { game: st.playing, name: user ? user.name : 'INVITADO', score: st.score, date: avToday() };\n        self.setState({ saving: true });\n        if (user) {\n          /* Backend (usuario autenticado):\n             REST → fetch('/api/scores', { method: 'POST', headers: { Authorization: 'Bearer ' + token }, body: JSON.stringify(entry) })\n             Supabase → supabase.from('scores').insert({ game_id, user_id, score }) */\n        } else {\n          var local = avLoadLocal(); local.push(entry); avSaveLocal(local);\n        }\n        self.later(function () {\n          var scores = Object.assign({}, self.state.scores);\n          scores[entry.game] = (scores[entry.game] || []).concat([entry]);\n          self.setState({ scores: scores, saving: false, saved: true });\n        }, 500);\n      },\n      playAgain: function () { self.setState({ over: false, loading: true }); self.later(function () { self.setState({ loading: false }); self.startGame(); }, 700); },\n      backToVault: function () { self.stopLoop(); self.g = null; self.setState({ view: 'library', over: false, playing: null, detail: null }); }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
